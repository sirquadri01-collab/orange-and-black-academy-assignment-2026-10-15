<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carefair - Dental Care</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><span>∞</span> Carefair</div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About us</a>
            <a href="#">Contact us</a>
        </nav>
        <a href="#booking" class="appointment">Make An Appointment</a>
    </header><main>
    <section class="hero">
        <div class="hero-content">
            <h1>Care-Fair! <span class="green">Mother like Care</span> for Your Young Ones</h1>
            <p class="description">We offer a wide range of dental services, from cosmetic dentistry makeovers to oral surgery and dental implants.</p>
        </div>

        <div class="hero-image">
            <img src="https://images.unsplash.com/photo-1492725764893-90b379c2b6e7?auto=format&fit=crop&w=1200&q=85" alt="Mother caring for her child">
            <div class="stat customer">
                <strong>180+</strong>
                <p>Satisfied Customer</p>
                <div class="stars">★★★★★</div>
                <small>4.9/5 Review</small>
            </div>
            <div class="stat parents">
                <strong>150+</strong>
                <p>Happy Parents<br>Registered</p>
            </div>
        </div>
    </section>

    <section class="booking" id="booking">
        <div class="field">
            <label>Email Address</label>
            <input type="email" placeholder="Your Email">
        </div>
        <div class="field">
            <label>Phone Number</label>
            <input type="tel" placeholder="Your Phone">
        </div>
        <div class="field">
            <label>Date</label>
            <input type="date" aria-label="Appointment date">
        </div>
        <button class="book-button" type="button">Book Now</button>
    </section>
</main>

</body>
              </html>
